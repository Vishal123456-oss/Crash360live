<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crash360Live</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
}

button,input{
    font-family:inherit;
}

/* LOGIN */
.login{
    position:fixed;
    inset:0;
    background:#080b12;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loginBox{
    width:90%;
    max-width:400px;
    background:#151a24;
    padding:30px;
    border-radius:22px;
    text-align:center;
}

.brand{
    color:#ff3b30;
    font-size:30px;
    font-weight:bold;
    margin-bottom:12px;
}

.loginBox input{
    width:100%;
    padding:15px;
    margin:15px 0;
    border:1px solid #303746;
    border-radius:10px;
    background:#0d1118;
    color:white;
    font-size:16px;
}

.greenBtn{
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-size:17px;
    font-weight:bold;
}

/* HEADER */
.header{
    background:#151a24;
    padding:18px;
    text-align:center;
    border-bottom:1px solid #292f3b;
}

.logo{
    color:#ff3b30;
    font-size:28px;
    font-weight:bold;
}

.player{
    color:#aaa;
    margin-top:7px;
}

.balance{
    margin-top:8px;
    font-size:19px;
}

#balance{
    color:#00e676;
}

/* WALLET */
.wallet{
    width:95%;
    max-width:680px;
    margin:15px auto;
    display:flex;
    gap:10px;
}

.wallet button{
    flex:1;
    padding:14px;
    border:0;
    border-radius:12px;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.deposit{
    background:#1565c0;
}

.withdraw{
    background:#6a1b9a;
}

/* GAME */
.game{
    width:95%;
    max-width:680px;
    margin:auto;
}

.gameScreen{
    height:350px;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    border:1px solid #303746;
    background:
    radial-gradient(circle at 50% 85%,
    #27466c,
    #121a28 45%,
    #080b12 75%);
}

.multiplier{
    position:absolute;
    top:38%;
    width:100%;
    text-align:center;
    font-size:60px;
    font-weight:bold;
}

.crashed{
    color:#ff3b30;
}

.plane{
    position:absolute;
    left:20px;
    bottom:25px;
    font-size:50px;
    transition:.1s linear;
}

/* CONTROLS */
.controls{
    margin-top:15px;
    padding:18px;
    background:#151a24;
    border-radius:18px;
}

#bet{
    width:100%;
    padding:14px;
    border:1px solid #303746;
    border-radius:10px;
    background:#0d1118;
    color:white;
    font-size:16px;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:12px;
}

.buttons button{
    flex:1;
    padding:14px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
}

.start{
    background:#00c853;
}

.cash{
    background:#ff9800;
}

button:disabled{
    background:#555!important;
}

.status{
    text-align:center;
    margin-top:14px;
    color:#ccc;
    min-height:22px;
}

/* HISTORY */
.history{
    margin-top:15px;
    padding:18px;
    background:#151a24;
    border-radius:18px;
}

.historyRow{
    padding:10px 5px;
    border-bottom:1px solid #292f3b;
}

/* MODAL */
.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:5000;
}

.modalBox{
    width:100%;
    max-width:420px;
    background:#151a24;
    border-radius:20px;
    padding:25px;
    position:relative;
}

.close{
    position:absolute;
    right:12px;
    top:10px;
    background:#303746;
    color:white;
    border:0;
    padding:8px 12px;
    border-radius:8px;
}

.modalTitle{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.modal input{
    width:100%;
    padding:14px;
    margin:7px 0;
    border:1px solid #303746;
    border-radius:10px;
    background:#0d1118;
    color:white;
}

.submit{
    width:100%;
    padding:14px;
    margin-top:10px;
    border:0;
    border-radius:10px;
    background:#00c853;
    color:white;
    font-weight:bold;
}

.info{
    background:#202631;
    padding:12px;
    border-radius:10px;
    color:#aaa;
    font-size:13px;
    margin:12px 0;
}

.logout{
    width:95%;
    max-width:680px;
    display:block;
    margin:15px auto 30px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#292f3b;
    color:white;
}

/* MOBILE */
@media(max-width:500px){

    .gameScreen{
        height:300px;
    }

    .multiplier{
        font-size:48px;
    }

    .buttons{
        flex-direction:column;
    }

    .wallet{
        flex-direction:column;
    }

    .logo{
        font-size:24px;
    }
}
</style>
</head>

        <input
